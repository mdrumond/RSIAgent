[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi"
version = "0.1.0"
description = "RSI programming workflows and shared contracts"
requires-python = ">=3.10"
dynamic = ["optional-dependencies"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsi*", "core*", "coding*", "config*", "env*", "llm*", "optimizer*", "explore*", "benchmarks*", "dashboard*", "integrations*"]
namespaces = true
exclude = ["*.node_modules", "*.node_modules.*", "tests", "tests.*", "*.tests", "*.tests.*", "build", "build.*", "*.build", "*.build.*", "*.dist", "*.dist.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.txt", "*.js", "*.mjs", "*.html", "*.css", "*.ts", "*.cpp", "*.inc", "*.sh", "*.lock", "Dockerfile", "*.example"]
dashboard = ["templates/*.html", "static/*"]

[tool.setuptools.dynamic.optional-dependencies]
legacy = {file = ["requirements.txt"]}
