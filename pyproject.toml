[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-tools"
version = "0.1.0"
description = "Ascend knowledge, verification and dashboard helpers for the native Pi controller"
requires-python = ">=3.12"
dependencies = ["mcp==1.27.2", "Flask==3.0.3"]

[project.optional-dependencies]
embeddings = ["torch==2.10.0", "transformers==5.0.0"]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ascend_tools", "ascend_tools.*"]
namespaces = true
exclude = ["*.tests", "*.tests.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
ascend_tools = ["templates/kdb/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests/ascend"]
python_files = ["test_*.py", "*_test.py", "target_*.py"]
pythonpath = [".", "tests/ascend"]
