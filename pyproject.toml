[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi"
version = "0.1.0"
description = "RSI programming workflows and shared contracts"
requires-python = ">=3.10"


[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools]
py-modules = ["run_a3kernels", "run_a3_phase1", "run_a5_baseline_archive", "run_a5_fireworks_sft", "run_a5kernels", "run_a5_phase1_adaptive", "run_a5_phase1", "run_a5_sft_experiment", "run_ale", "run_ascend_campaign", "run_ascend_subjects", "run_catlass_dsl_harness", "run_osworld"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rsi*", "core*", "coding*", "config*", "env*", "llm*", "optimizer*", "explore*", "benchmarks*", "dashboard*", "integrations*", "tools*"]
namespaces = true
exclude = ["*.node_modules", "*.node_modules.*", "tests", "tests.*", "*.tests", "*.tests.*", "build", "build.*", "*.build", "*.build.*", "*.dist", "*.dist.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.txt", "*.js", "*.mjs", "*.html", "*.css", "*.ts", "*.cpp", "*.inc", "*.sh", "*.lock", "Dockerfile", "*.example"]
dashboard = ["templates/*.html", "static/*"]

[project.optional-dependencies]
roles = ['nooa==0.0.10; python_version >= "3.12" and python_version < "3.14"']
legacy = [
  "openai==3.0.0",
  "requests==2.31.0",
  "requests-toolbelt==1.0.0",
  "Pillow==11.0.0",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.2",
  "cryptography==50.0.0",
  "Flask==3.0.3",
  "huggingface-hub==1.27.0",
  "docker==7.2.0",
  "filelock==3.32.6",
]
