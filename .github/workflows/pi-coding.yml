name: Pi coding microbenchmark (offline)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix integrations/pi
      - name: Check portable entrypoints
        run: |
          python -m benchmarks.pi_coding.export_evidence --help
      - name: Exercise real Pi with fake providers and validators
        run: >-
          python -m pytest -q
          tests/test_pi_coding_microbenchmark.py
