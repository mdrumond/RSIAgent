name: Ascend portable CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - name: Native controller, environment and MCP CPU contracts
        env:
          PYTHON: python
          PYTHONPATH: .:tests/ascend
        run: |
          tests=()
          for file in tests/ascend/*.mjs; do
            case "$file" in
              *_fixture.mjs|*_setup.mjs|*-fixture.mjs|*-worker.mjs) continue ;;
            esac
            tests+=("$file")
          done
          node --test --test-concurrency=1 "${tests[@]}"
      - name: Python knowledge, dashboard and target CPU contracts
        run: python -m pytest -q tests/ascend
